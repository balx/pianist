name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # The nix store (tools, homr models, the upright piano) between runs: a cold start downloads all of it.
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 4G
      - run: nix develop .#ci -c ruff check
      # The ci shell has every tool plus the 55 MB upright piano, so the mp3 render test runs too.
      - run: nix develop .#ci -c python3 -m pytest -q -rs
